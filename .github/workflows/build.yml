name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install the Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
      - name: Build and test
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:lintRelease :test-player:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: otori-apk
          path: app/build/outputs/apk/release/app-release.apk

  # Runs for a tag such as v0.1.0. To sign with your own key, add the repository secrets
  # OTORI_KEYSTORE_BASE64, OTORI_KEYSTORE_PASSWORD, OTORI_KEY_ALIAS and OTORI_KEY_PASSWORD.
  # Without them the APK uses a throwaway debug key, so each release must be installed fresh.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install the Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
      - name: Build the release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.OTORI_KEYSTORE_BASE64 }}
          OTORI_KEYSTORE_PASSWORD: ${{ secrets.OTORI_KEYSTORE_PASSWORD }}
          OTORI_KEY_ALIAS: ${{ secrets.OTORI_KEY_ALIAS }}
          OTORI_KEY_PASSWORD: ${{ secrets.OTORI_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export OTORI_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "otori-$GITHUB_REF_NAME.apk"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" otori-*.apk --generate-notes --verify-tag
